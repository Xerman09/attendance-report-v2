name: Vue CI/CD (Self-Hosted)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    # This tells GitHub to run the job ON your local Ubuntu machine
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue App
        run: npm run build

      - name: Distribute to System Folders
        run: |
          # Use the actual local path on your machine
          BASE_DIR="/home/vertex-server-2/system"
          
          # Loop through all directories ending in _system
          for sys_dir in "$BASE_DIR"/*_system; do
            if [ -d "$sys_dir/attendance-report-v2" ]; then
              echo "Updating $sys_dir/attendance-report-v2/dist/ ..."
              
              # Since we are already on the machine, we just use standard 'cp' or 'rsync'
              # This is instant because it doesn't use the internet
              rsync -a --delete dist/ "$sys_dir/attendance-report-v2/dist/"
            fi
          done
          echo "Deployment complete!"