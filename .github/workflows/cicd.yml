name: Vue CI/CD (Multi-Build & PM2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Distribute, Build, and Restart
        run: |
          BASE_DIR="/home/vertex-server-2/system"
          
          # 1. Loop through all directories ending in _system
          for sys_dir in "$BASE_DIR"/*_system; do
            APP_PATH="$sys_dir/attendance-report-v2"
            
            if [ -d "$APP_PATH" ]; then
              echo "------------------------------------------"
              echo "Processing: $APP_PATH"
              
              # 2. Sync latest source code to the folder (excluding node_modules)
              rsync -a --delete --exclude='node_modules' --exclude='.git' ./ "$APP_PATH/"
              
              # 3. Enter the folder and install/build
              cd "$APP_PATH"
              npm install
              npm run build
              
              # 4. PM2 Restart
              # This assumes your PM2 process name matches the folder name 
              # or you have an ecosystem file. Adjust if needed.
              # If your process names are unique, e.g., 'men2_system'
              SYS_NAME=$(basename "$sys_dir")
              pm2 restart "$SYS_NAME" || echo "Process $SYS_NAME not found in PM2, skipping restart."
              
              # Go back to the workspace root for the next loop iteration
              cd $GITHUB_WORKSPACE
            fi
          done
          echo "All systems updated and restarted!"